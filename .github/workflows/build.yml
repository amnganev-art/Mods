name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          rm -rf src build.gradle settings.gradle gradle.properties
          for f in *.zip; do
            if unzip -l "$f" | grep -q settings.gradle; then unzip -o "$f"; fi
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
      - run: gradle build --no-daemon -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - uses: actions/upload-artifact@v4
        with:
          name: akmod-jar
          path: build/libs/*.jar
